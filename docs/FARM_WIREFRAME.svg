<svg xmlns="http://www.w3.org/2000/svg" width="2740" height="1220" viewBox="0 0 2740 1220" font-family="'Baloo 2','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <style>
      .ink{fill:#1C293D}.inks{fill:#4A5A70}.on{fill:#FFFFFF}
      .surf{fill:#FFFCF5}.sunk{fill:#F0EBE0}
      .grn{fill:#3E9A5C}.blu{fill:#3E7ACC}.org{fill:#E68C29}.pur{fill:#8A5FBF}.sla{fill:#5A6B80}
      .star{fill:#FFCC2E}
      .frame{fill:none;stroke:#1C293D;stroke-width:3}
      .zone{fill:none;stroke:#8A5FBF;stroke-width:2;stroke-dasharray:8 6}
      .dim{stroke:#C2554E;stroke-width:2}
      .lbl{font-size:19px;fill:#1C293D}
      .lblw{font-size:19px;fill:#FFFFFF}
      .sm{font-size:15px;fill:#4A5A70}
      .tiny{font-size:13px;fill:#8A5FBF}
      .red{font-size:14px;fill:#C2554E;font-weight:600}
      .hd{font-size:30px;fill:#1C293D;font-weight:700}
      .sub{font-size:17px;fill:#4A5A70}
    </style>
    <g id="plotcard">
      <rect width="240" height="176" rx="26" class="sunk"/>
      <rect width="240" height="176" rx="26" fill="none" stroke="#C8BFA8" stroke-width="3"/>
    </g>
  </defs>

  <rect width="2740" height="1220" fill="#FFFFFF"/>

  <text x="40" y="48" class="hd">星光菜园 · 首期线框</text>
  <text x="40" y="80" class="sub">四块地 / 松土·播种·浇水·除草·收获 / 统一仓库 / 3 个 NPC 订单 —— 一切坐标从 get_viewport_rect().size 量起，不写死 720</text>

  <!-- ================= 16:9 ================= -->
  <text x="40" y="112" class="lbl" font-weight="700">① 1280 × 720（16:9，Mac / 手机横屏）</text>
  <rect x="40" y="126" width="1280" height="720" class="surf"/>
  <rect x="40" y="126" width="1280" height="720" class="frame"/>

  <!-- top bar -->
  <rect x="40" y="126" width="1280" height="96" fill="#FFFFFF"/>
  <line x1="40" y1="222" x2="1320" y2="222" stroke="#E3DCCB" stroke-width="3"/>
  <rect x="66" y="150" width="90" height="50" rx="16" class="sla"/>
  <text x="103" y="184" class="lblw" text-anchor="middle">←</text>
  <text x="180" y="185" class="ink" font-size="30" font-weight="700">星光菜园</text>
  <rect x="1020" y="148" width="128" height="52" rx="24" class="star"/>
  <circle cx="1048" cy="174" r="14" fill="#E68C29"/>
  <text x="1078" y="183" class="ink" font-size="24" font-weight="700">128</text>
  <rect x="1164" y="148" width="128" height="52" rx="24" fill="#EDE6D6"/>
  <path d="M1192 160 l7 15 16 2 -12 11 3 16 -14-8 -14 8 3-16 -12-11 16-2z" class="star"/>
  <text x="1244" y="183" class="ink" font-size="24" font-weight="700">42</text>
  <text x="1336" y="180" class="red">顶栏 96px · 币数用现成财宝角标样式</text>
  <text x="1336" y="202" class="sm">收获时金币飞过去（抄 result_screen.gd:187）</text>

  <!-- play area -->
  <rect x="64" y="246" width="1232" height="392" class="zone"/>
  <text x="72" y="266" class="tiny">play_area(self, true) + gui_input —— 绝不用 _unhandled_input（规则 3a3）</text>

  <!-- plots 2x2 -->
  <g transform="translate(120,286)">
    <use href="#plotcard"/>
    <circle cx="120" cy="72" r="34" fill="none" stroke="#3E9A5C" stroke-width="8" stroke-dasharray="150 64" transform="rotate(-90 120 72)"/>
    <text x="120" y="82" font-size="34" text-anchor="middle">🥕</text>
    <text x="120" y="140" class="lbl" text-anchor="middle" font-size="17">阶段 3 / 5</text>
  </g>
  <g transform="translate(500,286)">
    <use href="#plotcard"/>
    <circle cx="120" cy="76" r="30" fill="none" stroke="#C8BFA8" stroke-width="4" stroke-dasharray="6 8"/>
    <text x="120" y="88" font-size="30" text-anchor="middle" fill="#A89B80">＋</text>
    <text x="120" y="140" class="sm" text-anchor="middle" font-size="17">空地</text>
  </g>
  <g transform="translate(120,486)">
    <use href="#plotcard"/>
    <text x="120" y="86" font-size="34" text-anchor="middle">🌽</text>
    <circle cx="186" cy="42" r="20" class="blu"/>
    <text x="186" y="50" class="lblw" font-size="20" text-anchor="middle">💧</text>
    <text x="120" y="140" class="lbl" text-anchor="middle" font-size="17">等待帮助 · 缺水</text>
  </g>
  <g transform="translate(500,486)">
    <use href="#plotcard"/>
    <text x="120" y="86" font-size="34" text-anchor="middle">🍓</text>
    <circle cx="186" cy="42" r="20" class="grn"/>
    <text x="186" y="50" class="lblw" font-size="22" text-anchor="middle">✓</text>
    <text x="120" y="140" class="lbl" text-anchor="middle" font-size="17">可以收获</text>
  </g>

  <!-- spacing dimension -->
  <line x1="240" y1="452" x2="620" y2="452" class="dim"/>
  <line x1="240" y1="444" x2="240" y2="460" class="dim"/>
  <line x1="620" y1="444" x2="620" y2="460" class="dim"/>
  <text x="430" y="444" class="red" text-anchor="middle">中心间距 380px</text>
  <text x="430" y="470" class="red" text-anchor="middle">必须 ≥ 260（DragField.SNAP = 118 ×2 + 余量）</text>

  <!-- order board -->
  <rect x="800" y="286" width="440" height="240" rx="26" fill="#FFFFFF" stroke="#8A5FBF" stroke-width="4"/>
  <rect x="800" y="286" width="440" height="56" rx="26" class="pur"/>
  <rect x="800" y="316" width="440" height="26" class="pur"/>
  <text x="1020" y="325" class="lblw" font-size="22" text-anchor="middle" font-weight="700">今天谁需要帮忙</text>
  <circle cx="864" cy="400" r="30" fill="#EDE6D6"/>
  <text x="864" y="412" font-size="30" text-anchor="middle">🐻</text>
  <text x="910" y="392" class="ink" font-size="21">想要 3 根胡萝卜</text>
  <text x="910" y="420" class="sm" font-size="17">仓库里有 1 根</text>
  <rect x="1096" y="378" width="120" height="46" rx="20" class="star"/>
  <text x="1156" y="409" class="ink" font-size="21" text-anchor="middle" font-weight="700">🪙 12</text>
  <rect x="824" y="450" width="392" height="12" rx="6" class="sunk"/>
  <rect x="824" y="450" width="130" height="12" rx="6" class="grn"/>
  <text x="824" y="500" class="sm" font-size="17">还差 2 根就能送去了</text>
  <text x="1256" y="330" class="red">首期 3 个订单</text>
  <text x="1256" y="352" class="sm">交付前先写 delivered[]</text>
  <text x="1256" y="374" class="sm">再 await 动画（防连点）</text>

  <!-- tool shelf -->
  <rect x="40" y="678" width="1280" height="168" fill="#FFFFFF"/>
  <line x1="40" y1="678" x2="1320" y2="678" stroke="#E3DCCB" stroke-width="3"/>
  <g transform="translate(80,702)">
    <rect width="120" height="120" rx="26" class="org"/><text x="60" y="66" font-size="36" text-anchor="middle">🪏</text>
    <text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">松土</text>
  </g>
  <rect x="228" y="702" width="452" height="120" rx="26" class="sunk"/>
  <text x="248" y="726" class="sm" font-size="15">种子架（拖到土地上）</text>
  <g transform="translate(248,736)">
    <rect width="96" height="72" rx="18" fill="#FFFFFF" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="42" font-size="28" text-anchor="middle">🥕</text><text x="48" y="64" class="sm" font-size="14" text-anchor="middle">×3</text>
    <g transform="translate(108,0)"><rect width="96" height="72" rx="18" fill="#FFFFFF" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="42" font-size="28" text-anchor="middle">🌽</text><text x="48" y="64" class="sm" font-size="14" text-anchor="middle">×2</text></g>
    <g transform="translate(216,0)"><rect width="96" height="72" rx="18" fill="#FFFFFF" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="42" font-size="28" text-anchor="middle">🍓</text><text x="48" y="64" class="sm" font-size="14" text-anchor="middle">×1</text></g>
    <g transform="translate(324,0)"><rect width="96" height="72" rx="18" fill="#F0EBE0" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="42" font-size="28" text-anchor="middle" opacity="0.35">🍅</text><text x="48" y="64" class="sm" font-size="14" text-anchor="middle">×0</text></g>
  </g>
  <g transform="translate(708,702)">
    <rect width="120" height="120" rx="26" class="blu"/><text x="60" y="66" font-size="36" text-anchor="middle">💧</text>
    <text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">浇水</text>
    <circle cx="60" cy="60" r="52" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="196 130" opacity="0.9" transform="rotate(-90 60 60)"/>
  </g>
  <g transform="translate(856,702)">
    <rect width="120" height="120" rx="26" class="grn"/><text x="60" y="66" font-size="36" text-anchor="middle">✋</text>
    <text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">除草</text>
  </g>
  <g transform="translate(1004,702)">
    <rect width="120" height="120" rx="26" class="pur"/><text x="60" y="66" font-size="36" text-anchor="middle">🧺</text>
    <text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">仓库</text>
  </g>
  <text x="1336" y="736" class="red">工具架 168px</text>
  <text x="1336" y="760" class="sm">浇水 = 长按，白环是进度</text>
  <text x="1336" y="782" class="sm">需要新建 hold_gesture.gd</text>
  <text x="1336" y="804" class="sm">水声 water.ogg 已存在可直接用</text>
  <text x="1336" y="826" class="red">按钮 ≥ 220×120（UiKit.TOUCH_MIN）</text>

  <!-- ================= 4:3 ================= -->
  <text x="1420" y="112" class="lbl" font-weight="700">② 1280 × 960（4:3，iPad —— stretch/aspect = expand 的真实视口）</text>
  <rect x="1420" y="126" width="1280" height="960" class="surf"/>
  <rect x="1420" y="126" width="1280" height="960" class="frame"/>

  <rect x="1420" y="126" width="1280" height="96" fill="#FFFFFF"/>
  <line x1="1420" y1="222" x2="2700" y2="222" stroke="#E3DCCB" stroke-width="3"/>
  <rect x="1446" y="150" width="90" height="50" rx="16" class="sla"/>
  <text x="1483" y="184" class="lblw" text-anchor="middle">←</text>
  <text x="1560" y="185" class="ink" font-size="30" font-weight="700">星光菜园</text>
  <rect x="2400" y="148" width="128" height="52" rx="24" class="star"/>
  <text x="2464" y="183" class="ink" font-size="24" text-anchor="middle" font-weight="700">🪙 128</text>
  <rect x="2544" y="148" width="128" height="52" rx="24" fill="#EDE6D6"/>
  <text x="2608" y="183" class="ink" font-size="24" text-anchor="middle" font-weight="700">🌟 42</text>

  <rect x="1444" y="246" width="1232" height="632" class="zone"/>
  <text x="1452" y="266" class="tiny">多出来的 240px 全部给播放区 —— 顶栏和工具架高度不变</text>

  <g transform="translate(1500,300)">
    <use href="#plotcard"/><circle cx="120" cy="72" r="34" fill="none" stroke="#3E9A5C" stroke-width="8" stroke-dasharray="150 64" transform="rotate(-90 120 72)"/><text x="120" y="82" font-size="34" text-anchor="middle">🥕</text>
  </g>
  <g transform="translate(1880,300)"><use href="#plotcard"/><text x="120" y="88" font-size="30" text-anchor="middle" fill="#A89B80">＋</text></g>
  <g transform="translate(1500,560)"><use href="#plotcard"/><text x="120" y="86" font-size="34" text-anchor="middle">🌽</text><circle cx="186" cy="42" r="20" class="blu"/><text x="186" y="50" class="lblw" font-size="20" text-anchor="middle">💧</text></g>
  <g transform="translate(1880,560)"><use href="#plotcard"/><text x="120" y="86" font-size="34" text-anchor="middle">🍓</text><circle cx="186" cy="42" r="20" class="grn"/><text x="186" y="50" class="lblw" font-size="22" text-anchor="middle">✓</text></g>

  <rect x="2180" y="300" width="440" height="240" rx="26" fill="#FFFFFF" stroke="#8A5FBF" stroke-width="4"/>
  <rect x="2180" y="300" width="440" height="56" rx="26" class="pur"/><rect x="2180" y="330" width="440" height="26" class="pur"/>
  <text x="2400" y="339" class="lblw" font-size="22" text-anchor="middle" font-weight="700">今天谁需要帮忙</text>
  <text x="2244" y="414" font-size="30" text-anchor="middle">🐻</text>
  <text x="2290" y="406" class="ink" font-size="21">想要 3 根胡萝卜</text>
  <rect x="2476" y="392" width="120" height="46" rx="20" class="star"/><text x="2536" y="423" class="ink" font-size="21" text-anchor="middle" font-weight="700">🪙 12</text>

  <!-- 4:3 danger annotation -->
  <rect x="2180" y="580" width="440" height="180" rx="20" fill="#FDF1EF" stroke="#C2554E" stroke-width="3"/>
  <text x="2204" y="614" class="red" font-size="17">⚠ 这一档是历史事故重灾区</text>
  <text x="2204" y="644" class="sm" font-size="15">· 写死 y=720 的东西会飘在四分之一处</text>
  <text x="2204" y="668" class="sm" font-size="15">· 该 bug 在本项目上线过两次，现存 11 处</text>
  <text x="2204" y="692" class="sm" font-size="15">· probe 推事件要用窗口像素而非设计坐标</text>
  <text x="2204" y="716" class="sm" font-size="15">  （抄 studio_probe.gd:129 的 _glass()）</text>
  <text x="2204" y="740" class="sm" font-size="15">· 只设 window.size，不碰 content_scale_size</text>

  <rect x="1420" y="918" width="1280" height="168" fill="#FFFFFF"/>
  <line x1="1420" y1="918" x2="2700" y2="918" stroke="#E3DCCB" stroke-width="3"/>
  <g transform="translate(1460,942)"><rect width="120" height="120" rx="26" class="org"/><text x="60" y="66" font-size="36" text-anchor="middle">🪏</text><text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">松土</text></g>
  <rect x="1608" y="942" width="452" height="120" rx="26" class="sunk"/>
  <g transform="translate(1628,976)">
    <rect width="96" height="72" rx="18" fill="#FFFFFF" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="46" font-size="28" text-anchor="middle">🥕</text>
    <g transform="translate(108,0)"><rect width="96" height="72" rx="18" fill="#FFFFFF" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="46" font-size="28" text-anchor="middle">🌽</text></g>
    <g transform="translate(216,0)"><rect width="96" height="72" rx="18" fill="#FFFFFF" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="46" font-size="28" text-anchor="middle">🍓</text></g>
    <g transform="translate(324,0)"><rect width="96" height="72" rx="18" fill="#F0EBE0" stroke="#C8BFA8" stroke-width="3"/><text x="48" y="46" font-size="28" text-anchor="middle" opacity="0.35">🍅</text></g>
  </g>
  <g transform="translate(2088,942)"><rect width="120" height="120" rx="26" class="blu"/><text x="60" y="66" font-size="36" text-anchor="middle">💧</text><text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">浇水</text></g>
  <g transform="translate(2236,942)"><rect width="120" height="120" rx="26" class="grn"/><text x="60" y="66" font-size="36" text-anchor="middle">✋</text><text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">除草</text></g>
  <g transform="translate(2384,942)"><rect width="120" height="120" rx="26" class="pur"/><text x="60" y="66" font-size="36" text-anchor="middle">🧺</text><text x="60" y="104" class="lblw" font-size="17" text-anchor="middle">仓库</text></g>

  <!-- footer notes -->
  <text x="40" y="900" class="lbl" font-weight="700">首期不做</text>
  <text x="40" y="930" class="sm">NPC 拜访 · 悄悄摘一颗 · 加工小屋 · 大量食谱 · 菜园扩建 · 16 种作物 · 复杂装饰 · 真实网络玩家 · 排行榜</text>
  <text x="40" y="972" class="lbl" font-weight="700">首期图标缺口（IconLibrary 98 个 id 里一个都没有）</text>
  <text x="40" y="1002" class="sm">seed · sprout · watering_can · weed · soil · basket · fence · scarecrow —— 可复用的只有 leaf / carrot / berries</text>
  <text x="40" y="1044" class="lbl" font-weight="700">六岁孩子不识字</text>
  <text x="40" y="1074" class="sm">地块状态一律用图形表达：进度环 = 长到哪了，水滴 = 渴了，对勾 = 可以收了。图上的中文只是给你看的标注。</text>
  <text x="40" y="1116" class="sm" font-size="14" fill="#8A5FBF">配色取自 scripts/ui/palette.gd（全部 WCAG AA 4.5:1 达标）· 圆角 30 / 按钮厚度 8 取自 UiKit.RADIUS 与 UiKit.EDGE</text>
</svg>
